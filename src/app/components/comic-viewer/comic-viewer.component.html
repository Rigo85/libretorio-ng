<div id="image-container" class="d-flex justify-content-center align-items-center position-relative">
	<div class="d-flex justify-content-center align-items-center">
		@for(frame of frames;track frame.token){
			<img [src]="frame.src" alt="" (load)="imageLoaded(frame)" (error)="imageFailed(frame)"/>
		}
	</div>
</div>

<reading-status [tracker]="progress"></reading-status>
@if(warning){<p class="small text-warning m-2" role="status">{{warning}}
  @if(canRetry){<button type="button" class="btn btn-sm btn-outline-secondary" title="Reintentar" aria-label="Reintentar" (click)="retry()"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i></button>}
</p>}

<error-message [onClose]="onClose"></error-message>

<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#fffa" type="square-jelly-box" [fullScreen]="true">
	<p style="color: white"> Loading... </p>
</ngx-spinner>
